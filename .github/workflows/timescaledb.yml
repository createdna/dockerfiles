name: TimescaleDB image

on:
  pull_request:
    paths:
      - "timescaledb/**"
      - ".github/workflows/timescaledb.yml"
  push:
    branches: [main]
    paths:
      - "timescaledb/**"
      - ".github/workflows/timescaledb.yml"
  workflow_dispatch:
    inputs:
      pg_version:
        description: "PostgreSQL major version"
        default: "17"
      timescaledb_version:
        description: "TimescaleDB apt package version (see timescaledb/list-versions.sh)"
        default: "2.25.1~debian12-1709"
      toolkit_version:
        description: "Toolkit apt package version (needs the 1: epoch)"
        default: "1:1.22.0~debian12"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/timescaledb
  PG_VERSION: ${{ inputs.pg_version || '17' }}
  TIMESCALEDB_VERSION: ${{ inputs.timescaledb_version || '2.25.1~debian12-1709' }}
  TOOLKIT_VERSION: ${{ inputs.toolkit_version || '1:1.22.0~debian12' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          ts="${TIMESCALEDB_VERSION%%~*}"
          echo "tag=${IMAGE}:${ts}-pg${PG_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: timescaledb
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            PG_VERSION=${{ env.PG_VERSION }}
            TIMESCALEDB_VERSION=${{ env.TIMESCALEDB_VERSION }}
            TOOLKIT_VERSION=${{ env.TOOLKIT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
